name: Build & commit CV PDFs

on:
  push:
    paths:
      - 'cv.tex'
      - 'cv_es.tex'
      - 'cv_plain.tex'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CV repo
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-spanish \
            lmodern

      - name: Compile English CV
        run: |
          pdflatex -interaction=nonstopmode cv.tex
          pdflatex -interaction=nonstopmode cv.tex

      - name: Compile Spanish CV
        run: |
          pdflatex -interaction=nonstopmode cv_es.tex
          pdflatex -interaction=nonstopmode cv_es.tex

      - name: Compile Plain CV
        run: |
          pdflatex -interaction=nonstopmode cv_plain.tex
          pdflatex -interaction=nonstopmode cv_plain.tex

      - name: Commit PDFs back to CV repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.pdf cv_es.pdf cv_plain.pdf
          git diff --cached --quiet || git commit -m "ci: rebuild CV PDFs [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout portfolio repo
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: itzi97/my-portfolio
          token: ${{ secrets.PORTFOLIO_TOKEN }}
          path: portfolio

      - name: Copy PDFs to portfolio public/
        if: github.ref == 'refs/heads/main'
        run: |
          cp cv.pdf     portfolio/public/itziar-morales-cv.pdf
          cp cv_es.pdf  portfolio/public/itziar-morales-cv-es.pdf

      - name: Commit & push PDFs to portfolio
        if: github.ref == 'refs/heads/main'
        run: |
          cd portfolio
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/itziar-morales-cv.pdf public/itziar-morales-cv-es.pdf
          git diff --cached --quiet || git commit -m "ci: sync CV PDFs from cv repo [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
