name: Build & commit CV PDFs

on:
  push:
    paths:
      - 'cv.tex'
      - 'cv_es.tex'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CV repo
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra

      - name: Compile English CV
        run: |
          pdflatex -interaction=nonstopmode cv.tex
          pdflatex -interaction=nonstopmode cv.tex

      - name: Compile Spanish CV
        run: |
          pdflatex -interaction=nonstopmode cv_es.tex
          pdflatex -interaction=nonstopmode cv_es.tex

      - name: Commit PDFs back to this repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.pdf cv_es.pdf
          git diff --cached --quiet || git commit -m "ci: rebuild CV PDFs [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
